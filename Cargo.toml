[workspace]
resolver = "2"
members = ["crates/masthead-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zstd = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
